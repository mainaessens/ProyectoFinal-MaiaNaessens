<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pieza</title>
<link rel="stylesheet" href="{{MARCA}}/marca.css">
<link rel="stylesheet" href="{{BASE}}/base.css">
<!-- Plantilla base. Editá el texto y las clases; los colores y tipografías salen de la marca (var(--c-*), var(--f-*)). -->
</head>
<body>
<!-- Carrusel 4:5. Una .piece por placa: portada, desarrollo y cierre con una sola acción. -->
<section class="piece f-feed-4x5" data-tema="oscuro" data-name="portada">
  <div class="piece-head"><p class="eyebrow">Tema</p><span class="slide-counter">1 / 3</span></div>
  <div class="stack grow center"><h1 class="display balance">Portada con una promesa clara</h1></div>
  <div class="piece-foot"><span class="logo"><span class="wordmark">Marca</span></span><span class="meta">Deslizá →</span></div>
</section>
<section class="piece f-feed-4x5" data-name="desarrollo">
  <div class="piece-head"><p class="eyebrow">El punto</p><span class="slide-counter">2 / 3</span></div>
  <div class="stack grow center">
    <h2 class="h1 balance">Una idea por placa</h2>
    <p class="lead">Ejemplo, contraste o explicación breve.</p>
  </div>
</section>
<section class="piece f-feed-4x5" data-tema="primario" data-name="cierre">
  <div class="piece-head"><p class="eyebrow">Para cerrar</p><span class="slide-counter">3 / 3</span></div>
  <div class="stack grow center">
    <h2 class="h1 balance">Una sola acción para el lector</h2>
    <span class="cta">Escribinos</span>
  </div>
  <div class="piece-foot"><span class="logo"><span class="wordmark">Marca</span></span><span class="meta">sitio.com</span></div>
</section>
</body>
</html>
