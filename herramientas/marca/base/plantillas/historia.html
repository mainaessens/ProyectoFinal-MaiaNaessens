<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pieza</title>
<link rel="stylesheet" href="{{MARCA}}/marca.css">
<link rel="stylesheet" href="{{BASE}}/base.css">
<!-- Plantilla base. Editá el texto y las clases; los colores y tipografías salen de la marca (var(--c-*), var(--f-*)). -->
</head>
<body>
<!-- Historias 9:16 (1080x1920). El texto queda dentro de las zonas seguras (250 px arriba, 340 px abajo). Una .piece por historia. -->
<section class="piece f-story" data-tema="oscuro" data-name="historia-1">
  <p class="eyebrow">Hoy</p>
  <div class="stack grow center">
    <h1 class="h1 balance">Una idea por historia</h1>
    <p class="lead">Texto corto, legible en el celular.</p>
  </div>
  <span class="logo"><span class="wordmark">Marca</span></span>
</section>
<section class="piece f-story" data-tema="primario" data-name="historia-2">
  <p class="eyebrow">Para vos</p>
  <div class="stack grow center">
    <h1 class="h1 balance">Cerrá con una acción</h1>
    <span class="cta">Escribinos por mensaje</span>
  </div>
  <span class="logo"><span class="wordmark">Marca</span></span>
</section>
</body>
</html>
